name: Bug
description: Something is wrong (run /triage to complete labels)
labels: ["type:bug", "status:triage"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "Include screenshots, pattern IDs, measurements used" }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, value: "1. \n2. " }
  - type: dropdown
    id: env
    attributes: { label: Environment, options: [dev, preview, staging, prod] }
