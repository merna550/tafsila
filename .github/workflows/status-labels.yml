name: Sync status labels
# Keeps exactly one status:* label on issues linked from PRs ("Closes #N").
on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  pull_request_review:
    types: [submitted]

permissions:
  issues: write
  pull-requests: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const nums = [...body.matchAll(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)].map(m => Number(m[1]));
            if (!nums.length) return;

            let next = null;
            if (context.eventName === "pull_request") {
              const a = context.payload.action;
              if (a === "closed") next = pr.merged ? "status:on-staging" : null;
              else if (!pr.draft) next = "status:in-review";
            } else if (context.eventName === "pull_request_review") {
              const s = context.payload.review.state;
              if (s === "changes_requested") next = "status:changes-requested";
            }
            if (!next) return;

            for (const issue_number of nums) {
              const { data: labels } = await github.rest.issues.listLabelsOnIssue({ ...context.repo, issue_number });
              for (const l of labels) {
                if (l.name.startsWith("status:") && l.name !== next) {
                  await github.rest.issues.removeLabel({ ...context.repo, issue_number, name: l.name });
                }
              }
              await github.rest.issues.addLabels({ ...context.repo, issue_number, labels: [next] });
              core.info(`#${issue_number} -> ${next}`);
            }
