name: Claude agent
# Builds an issue with Claude Code in GitHub's cloud (issue #16). No Claude GitHub App is installed:
# - Claude auth: CLAUDE_CODE_OAUTH_TOKEN (subscription, from `claude setup-token`).
# - GitHub auth: AGENT_GITHUB_TOKEN, a fine-grained PAT limited to this repo (contents, pull requests,
#   issues: read/write). PRs opened with the default GITHUB_TOKEN do not trigger CI, so this token is required.
# Cost guard (issue #17): every run stops after 50 agent turns (--max-turns 50).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_call:
    inputs:
      issue:
        description: Issue number to build
        required: true
        type: string
      model:
        description: Model alias from the build:* label (opus, sonnet, haiku)
        required: false
        type: string
        default: sonnet
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      AGENT_GITHUB_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: claude-${{ inputs.issue || github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Comment triggers: only Merna, only when the comment mentions @claude. workflow_call always runs.
    # Under workflow_call, github.event_name is the CALLER's event (schedule / workflow_dispatch), never
    # 'workflow_call', so a dispatcher call is detected by its required `issue` input instead (issue #38).
    if: >-
      inputs.issue != '' ||
      (github.actor == 'merna550' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.AGENT_GITHUB_TOKEN }}

      - name: Resolve issue and model
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          INPUT_ISSUE: ${{ inputs.issue }}
          INPUT_MODEL: ${{ inputs.model }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
        run: |
          issue="${INPUT_ISSUE:-$EVENT_ISSUE}"
          model="$INPUT_MODEL"
          if [ -z "$model" ] && [ -n "$issue" ]; then
            model="$(gh issue view "$issue" --json labels --jq '[.labels[].name | select(startswith("build:")) | sub("build:";"")][0] // "sonnet"' 2>/dev/null || echo sonnet)"
          fi
          case "${model:-sonnet}" in opus|sonnet|haiku) ;; *) model=sonnet ;; esac
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "model=${model:-sonnet}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Prepare workspace
        run: bash scripts/agent-setup.sh

      - name: Build issue (dispatcher)
        if: inputs.issue != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          prompt: /build #${{ steps.ctx.outputs.issue }}
          claude_args: --model ${{ steps.ctx.outputs.model }} --max-turns 50

      - name: Answer @claude comment
        if: inputs.issue == ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          claude_args: --model ${{ steps.ctx.outputs.model }} --max-turns 50
