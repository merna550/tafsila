name: Claude agent
# Builds an issue with Claude Code in GitHub's cloud (issue #16). No Claude GitHub App is installed:
# - Claude auth: CLAUDE_CODE_OAUTH_TOKEN (subscription, from `claude setup-token`).
# - GitHub auth: AGENT_GITHUB_TOKEN, a fine-grained PAT limited to this repo (contents, pull requests,
#   issues: read/write). PRs opened with the default GITHUB_TOKEN do not trigger CI, so this token is required.
# Cost guard (issue #17): every run stops after 50 agent turns (--max-turns 50).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_call:
    inputs:
      issue:
        description: Issue number to build
        required: true
        type: string
      model:
        description: Model alias from the build:* label (opus, sonnet, haiku)
        required: false
        type: string
        default: sonnet
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      AGENT_GITHUB_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: claude-${{ inputs.issue || github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Comment triggers: only Merna, only when the comment mentions @claude. workflow_call always runs.
    # Under workflow_call, github.event_name is the CALLER's event (schedule / workflow_dispatch), never
    # 'workflow_call', so a dispatcher call is detected by its required `issue` input instead (issue #38).
    if: >-
      inputs.issue != '' ||
      (github.actor == 'merna550' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Headless Claude Code refuses tools that are not allowed up front; /build needs Bash (node, gh, pnpm,
      # git) and Agent (builder-* / planner-* subagents), so without this list it stops after 3 turns (issue #46).
      CLAUDE_TOOLS: Bash,Read,Edit,MultiEdit,Write,Glob,Grep,Agent,Task,TodoWrite,Skill,SlashCommand,WebFetch
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.AGENT_GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # v5 auto-caches the package manager named in package.json (pnpm), which is not installed in
          # this job, and fails with "Unable to locate executable file: pnpm" (issue #42).
          package-manager-cache: false

      - name: Resolve issue and model
        # Model from the issue's build:* label (sonnet when missing). A comment on a PR uses the PR's linked
        # issue (closing reference or "Closes #N"); the dispatcher passes its issue and model (issue #40).
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          INPUT_ISSUE: ${{ inputs.issue }}
          INPUT_MODEL: ${{ inputs.model }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          EVENT_PR: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
        run: |
          if [ -n "$INPUT_ISSUE" ]; then set -- "$INPUT_ISSUE" --model "$INPUT_MODEL"
          elif [ -n "$EVENT_PR" ]; then set -- --pr "$EVENT_PR"
          else set -- "$EVENT_ISSUE"; fi
          node scripts/agent-model.mjs build "$@"

      - name: Prepare workspace
        run: bash scripts/agent-setup.sh

      - name: Build issue (dispatcher)
        id: build
        if: inputs.issue != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          # Quoted: unquoted, YAML reads " #..." as a comment and Claude gets a bare "/build" (issue #44).
          prompt: "/build #${{ steps.ctx.outputs.issue }}"
          claude_args: --model ${{ steps.ctx.outputs.model }} --max-turns 50 --allowedTools ${{ env.CLAUDE_TOOLS }}

      - name: Answer @claude comment
        id: answer
        if: inputs.issue == ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          claude_args: --model ${{ steps.ctx.outputs.model }} --max-turns 50 --allowedTools ${{ env.CLAUDE_TOOLS }}

      - name: Keep Claude's transcript
        # The action hides Claude's output; the transcript shows what it did and why it stopped (issue #48).
        # Private repo, 7 days. It can contain command output, so never print secrets in agent commands.
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: claude-transcript
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Record agent usage
        # One numbers-only record on the `metrics` branch and a one-line comment on the issue (issue #36).
        # Never fails the job: metrics must not hide the real result of the run.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          EXECUTION_FILE: ${{ steps.build.outputs.execution_file || steps.answer.outputs.execution_file }}
          ISSUE: ${{ steps.ctx.outputs.issue }}
          MODEL: ${{ steps.ctx.outputs.model }}
          GIT_AUTHOR_NAME: claude[bot]
          GIT_AUTHOR_EMAIL: noreply@anthropic.com
          GIT_COMMITTER_NAME: claude[bot]
          GIT_COMMITTER_EMAIL: noreply@anthropic.com
        run: |
          [ -f "$EXECUTION_FILE" ] && [ -n "$ISSUE" ] || { echo "No execution file or issue; skipping."; exit 0; }
          labels="$(gh issue view "$ISSUE" --json labels --jq '[.labels[].name] | join(",")')"
          pr="$(gh pr list --state all --search "Closes #$ISSUE in:body" --json number --jq '.[0].number // empty')"
          node scripts/agent-usage.mjs record --execution "$EXECUTION_FILE" --issue "$ISSUE" --pr "$pr" \
            --model "$MODEL" --labels "$labels" --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" >"$RUNNER_TEMP/record.json"
          [ -s "$RUNNER_TEMP/record.json" ] || exit 0
          node scripts/agent-usage.mjs append --file "$RUNNER_TEMP/record.json"
          gh issue comment "$ISSUE" --body "$(node scripts/agent-usage.mjs line --file "$RUNNER_TEMP/record.json")"

      - name: Fail when Claude was refused a tool
        # The action reports success even when every tool call was refused (issue #46), so check the transcript.
        # Prints each refused command or path (issue #58), so the cause is in the log without the artifact.
        env:
          EXECUTION_FILE: ${{ steps.build.outputs.execution_file || steps.answer.outputs.execution_file }}
        run: node scripts/claude-run.mjs check "$EXECUTION_FILE"

      - name: Block the issue after a failed dispatcher build
        # Any failure of a dispatcher build moves the issue to status:blocked with the reason and the refused
        # commands, so the dispatcher can never pick it again in a loop (issue #58).
        if: failure() && inputs.issue != ''
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          ISSUE: ${{ inputs.issue }}
          # The action writes this file even when its step fails; the output is only set on success.
          EXECUTION_FILE: ${{ steps.build.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/claude-run.mjs block "$ISSUE" "$EXECUTION_FILE" "$RUN_URL"
