name: Supabase
# Proves the migrations + seed apply cleanly on a fresh local Supabase (issue #18).
# Like the Storybook, Docker and e2e jobs (issues #86, #83), a scope job decides with scripts/ci-paths.mjs and the db-reset job
# is skipped by its `if` when no database file changed; a skipped job counts as passed, so it can be required.
on:
  pull_request:
  push:
    branches: [main]
# A new push to a pull request cancels the older run of the same workflow; main never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope-db:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the path filter compares against the base branch / previous commit
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: node scripts/ci-paths.mjs supabase "$EVENT" "$BASE_REF" "$BEFORE" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  db-reset:
    needs: scope-db
    if: needs.scope-db.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (no Studio, mail catcher or edge runtime needed)
        run: pnpm exec supabase start -x studio,edge-runtime,logflare,vector,imgproxy
      - name: Apply migrations and seed on a fresh database
        run: pnpm db:reset
      - name: RLS and schema tests (pgTAP)
        run: pnpm db:test
      - name: API repository tests (Drizzle through withUser, RLS as the user)
        env:
          DATABASE_URL: postgresql://api_app:api_app_local_only@127.0.0.1:54322/postgres
        run: pnpm --filter @tafsila/api test:db
      - name: Stop
        if: always()
        run: pnpm db:stop
