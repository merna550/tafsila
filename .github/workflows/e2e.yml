name: Web e2e
# Playwright flows of apps/web (Arabic and English, mobile and desktop) against a production build and local Supabase
# with the mail catcher (part C of #25 reads the confirmation emails there). Issue #90.
# Like the Storybook and Docker jobs (issue #86), a scope job decides with scripts/ci-paths.mjs and the e2e job is
# skipped by its `if`; a skipped job counts as passed, so this check can be required without blocking docs-only PRs.
# Free and open source only (ADR-022).
on:
  pull_request:
  push:
    branches: [main]
# A new push to a pull request cancels the older run of the same workflow; main never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the path filter compares against the base branch / previous commit
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: node scripts/ci-paths.mjs e2e "$EVENT" "$BASE_REF" "$BEFORE" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  e2e:
    needs: scope-e2e
    if: needs.scope-e2e.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (database, auth and the mail catcher)
        run: pnpm exec supabase start -x studio,edge-runtime,logflare,vector,imgproxy
      - name: Non-secret app config (same placeholders as the Docker smoke test)
        run: grep -Ev '^\s*(#|$)' .github/ci.env >> "$GITHUB_ENV"
      - name: Point the app at the local Supabase (the sign-in flows need its real address and anon key)
        run: |
          echo "SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          pnpm exec supabase status -o env | grep '^ANON_KEY=' | sed 's/^ANON_KEY=/SUPABASE_ANON_KEY=/; s/"//g' >> "$GITHUB_ENV"
          # Deleting an account (issue #27) calls the GoTrue admin API and Storage with the service role key, so the
          # placeholder from ci.env is replaced by the key of this throwaway local stack (it exists only on the runner).
          pnpm exec supabase status -o env | grep '^SERVICE_ROLE_KEY=' | sed 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/; s/"//g' >> "$GITHUB_ENV"
      - name: Playwright browser cache
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Build and run the e2e flows
        run: pnpm --filter web test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
      - name: Stop Supabase
        if: always()
        run: pnpm db:stop
