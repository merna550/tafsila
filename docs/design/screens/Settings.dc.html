<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الإعدادات</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6B65}a:hover{color:#0A5651}
input:focus,button:focus-visible,a:focus-visible{outline:2px solid #0E6B65;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: #FBF7F1; color: #2A2220; font-family: 'IBM Plex Sans Arabic', 'Noto Kufi Arabic', Tahoma, sans-serif; direction: rtl;">
  <header style="background: #FFFFFF; border-bottom: 1px solid #D9CCBC;">
    <div style="max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px;">
      <a href="Clients.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; color: #2A2220; text-decoration: none;">
        <svg width="36" height="36" viewBox="0 0 56 56" aria-hidden="true"><rect x="4" y="4" width="48" height="48" rx="16" fill="#0E6B65"></rect><path d="M14 34 L42 22" stroke="#FBF7F1" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"></path><circle cx="40" cy="36" r="5" fill="#EBA83F"></circle></svg>
        <span style="font-size: 20px; font-weight: 600;">تفصيلة</span>
      </a>
      <nav aria-label="القائمة الرئيسية" style="display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 auto;">
        <a href="Clients.dc.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; color: #2A2220; font-size: 15px; font-weight: 500; text-decoration: none;">العميلات</a>
        <a href="#" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; color: #2A2220; font-size: 15px; font-weight: 500; text-decoration: none;">تصاميمي</a>
        <a href="Settings.dc.html" aria-current="page" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; background: #E1F0ED; color: #0E6B65; font-size: 15px; font-weight: 600; text-decoration: none;">الإعدادات</a>
      </nav>
      <span aria-label="منى" style="width: 40px; height: 40px; border-radius: 20px; background: #A84A22; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600;">م</span>
    </div>
  </header>

  <main style="max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; display: flex; flex-direction: column; gap: 20px;">
    <h1 style="margin: 0; font-size: 24px; line-height: 36px; font-weight: 600;">الإعدادات</h1>

    <section style="background: #FFFFFF; border-radius: 16px; box-shadow: 0 1px 2px rgba(42,34,32,.06), 0 2px 8px rgba(42,34,32,.06); padding: 24px; display: flex; flex-direction: column; gap: 18px;">
      <h2 style="margin: 0; font-size: 20px; line-height: 30px; font-weight: 600;">حسابي</h2>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label for="name" style="font-size: 15px; font-weight: 600;">الاسم</label>
        <input id="name" value="منى إبراهيم" style="height: 48px; box-sizing: border-box; border: 1px solid #8C7D72; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 17px; color: #2A2220;">
      </div>
      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; background: #FBF7F1; border-radius: 10px;">
        <div>
          <div style="font-size: 15px; font-weight: 600;">رقم الهاتف</div>
          <div style="font-size: 17px;" dir="ltr">+20 10 1234 5678</div>
        </div>
        <span style="display: flex; align-items: center; gap: 6px; color: #2B7547; font-size: 15px; font-weight: 600;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"></path></svg>
          مؤكَّد
        </span>
      </div>
    </section>

    <section style="background: #FFFFFF; border-radius: 16px; box-shadow: 0 1px 2px rgba(42,34,32,.06), 0 2px 8px rgba(42,34,32,.06); padding: 24px; display: flex; flex-direction: column; gap: 18px;">
      <h2 style="margin: 0; font-size: 20px; line-height: 30px; font-weight: 600;">العرض</h2>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 15px; font-weight: 600;">اللغة</span>
        <div style="display: flex; background: #F3ECE2; border-radius: 10px; padding: 4px; gap: 4px; max-width: 360px;">
          <button type="button" aria-pressed="true" style="flex: 1; height: 44px; border: 0; border-radius: 8px; background: #FFFFFF; color: #2A2220; font: inherit; font-size: 15px; font-weight: 600; box-shadow: 0 1px 2px rgba(42,34,32,.08);">العربية</button>
          <button type="button" aria-pressed="false" style="flex: 1; height: 44px; border: 0; border-radius: 8px; background: transparent; color: #625650; font: inherit; font-size: 15px; font-weight: 600;">English</button>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 15px; font-weight: 600;">وحدة القياس</span>
        <span style="font-size: 17px;">سنتيمتر</span>
        <span style="font-size: 15px; color: #625650;">وحدة الإنش قريباً.</span>
      </div>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #B42318; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 12px;">
      <h2 style="margin: 0; font-size: 20px; line-height: 30px; font-weight: 600; color: #B42318;">حذف الحساب</h2>
      <p style="margin: 0; font-size: 17px; line-height: 28px;">يحذف جميع العميلات ومقاساتهن وصورك نهائياً، ولا يمكن التراجع عنه. ولا يتيح رقم هاتفك تجربة مجانية جديدة بعد الحذف.</p>
      <div><button type="button" style="height: 48px; padding: 0 20px; border: 1px solid #B42318; border-radius: 10px; background: #FFFFFF; color: #B42318; font: inherit; font-size: 15px; font-weight: 600;">حذف حسابي</button></div>
    </section>

    <div><a href="Main.dc.html" style="min-height: 44px; display: inline-flex; align-items: center; font-size: 15px; font-weight: 600;">تسجيل الخروج</a></div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
